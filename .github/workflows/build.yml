name: Build Artemis-ODB core only

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: List project files
        run: find . -maxdepth 2 -type f | sed 's/^\.\///'

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build artemis-core module
        run: ./gradlew :artemis-core:clean :artemis-core:build --stacktrace --info

      - name: Upload core JAR
        uses: actions/upload-artifact@v4
        with:
          name: artemis-core-jar
          path: artemis-core/build/libs/*.jar
